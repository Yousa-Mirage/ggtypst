[package]
name = "ggtypst"
version = "0.1.1"
edition = "2024"
rust-version = "1.92"
publish = false

[lib]
crate-type = ["staticlib"]
name = "ggtypst"

[dependencies]
extendr-api = "0.9.0"
mitex = "0.2.4"
ttf-parser = "0.25.1"
typst = "0.15.0"
typst-kit = {
  version = "0.15.0",
  default-features = false,
  features = [
    "embedded-fonts",
    "scan-fonts",
  ]
}
typst-layout = "0.15.0"
typst-render = "0.15.0"

[lints.clippy]
expect_used = "deny"
unwrap_used = "deny"

[lints.rust]
warnings = "deny"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
strip = true
lto = true
