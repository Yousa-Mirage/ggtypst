name: Code Quality Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: code-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/rust -> target
          # Keep the cache when only a formatting or lint check failed.
          cache-on-failure: true

      - name: Install air
        uses: posit-dev/setup-air@v1

      - name: Check R formatting
        if: ${{ !cancelled() }}
        run: air format . --check

      - name: Lint R code
        if: ${{ !cancelled() }}
        uses: etiennebacher/setup-jarl@v0.1.1

      - name: Check Rust formatting
        if: ${{ !cancelled() }}
        run: cargo fmt --manifest-path src/rust/Cargo.toml --check

      - name: Spell check
        if: ${{ !cancelled() }}
        run: |
          install.packages(c("spelling", "cli", "rlang"))
          options(crayon.enabled = TRUE)
          spelling_mistakes <- spelling::spell_check_package()
          cli::cli_rule()
          if (length(spelling_mistakes$word) > 0L) {
            print(spelling_mistakes)
            rlang::abort("Spelling errors found. Either correct them or update `inst/WORDLIST` using `spelling::update_wordlist()`.")
          } else {
            cli::cli_alert_success("No spelling errors found.")
          }
          cli::cli_rule()
        shell: Rscript {0}

      - name: Run clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --manifest-path src/rust/Cargo.toml
